run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    # Core correctness (non-negotiable)
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - typecheck

    # Style & formatting
    - gofmt
    - gofumpt
    - revive
    - lll

    # Maintainability
    - funlen
    - gocyclo
    - gocognit

    # Backend safety (important for expense apps)
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - nilerr
    - errorlint

    # Security (moderate)
    - gosec

linters-settings:
  lll:
    line-length: 120

  funlen:
    lines: 80
    statements: 40

  gocyclo:
    min-complexity: 15

  gocognit:
    min-complexity: 15

  revive:
    ignore-generated-header: true
    rules:
      - name: var-naming
      - name: early-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: receiver-naming
      - name: function-length
        arguments: [80, true] # maxLines, skipComments
      - name: file-length-limit
        arguments: [400, true] # maxLines, skipComments
      - name: line-length-limit
        arguments: [120]


  gosec:
    severity: medium
    confidence: medium

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
