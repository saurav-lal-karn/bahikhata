version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - nilerr
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    gosec:
      severity: medium
      confidence: medium
    lll:
      line-length: 120
    revive:
      rules:
        - name: var-naming
        - name: early-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: receiver-naming
        - name: function-length
          arguments: [80, 40]
        - name: file-length-limit
          arguments:
            - max: 400
            - skipComments: true
        - name: line-length-limit
          arguments:
            - 120
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
