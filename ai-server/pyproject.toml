[tool.poetry]
name = "bahikhata-ai-server"
version = "0.1.0"
description = "AI Server for Bahikhata using FastAPI"
authors = ["Saurav Lal Karn <sauravlalkarn@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
python-multipart = "^0.0.17"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
groq = "^0.11.0"
pytesseract = "^0.3.13"
chromadb = "^0.5.0"
pillow = "^11.1.0"
pdf2image = "^1.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
black = "^24.10.0"
isort = "^5.13.0"
flake8 = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
